config:
  target: "ws://localhost:1337"
  processor: "../../helpers/auth.cjs"
  plugins:
    ensure: {}
  phases:
    - name: "smoke"
      duration: 8
      arrivalRate: 2
  ensure:
    maxErrorRate: 2
scenarios:
  - engine: "ws"
    name: "workspace-ws"
    flow:
      - connect:
          function: "wsConnect"
          id: "ws-{{ $randomString() }}"
      - think: 45

