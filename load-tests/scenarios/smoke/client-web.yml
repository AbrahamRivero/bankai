config:
  target: "http://localhost:3000"
  processor: "../../helpers/auth.cjs"
  plugins:
    ensure: {}
  phases:
    - name: "smoke"
      duration: 8
      arrivalRate: 2
  ensure:
    maxErrorRate: 2
    thresholds:
      - "http.response_time.p95": 2500
scenarios:
  - name: "browse"
    weight: 8
    flow:
      - function: "setPublicVars"
      - get:
          url: "/"
          name: "home"
      - get:
          url: "/products"
          name: "products-page"
      - get:
          url: "/products/{{ slug }}"
          name: "product-page"
      - get:
          url: "/api/products?workspaceId={{ workspaceId }}"
          name: "api-via-rewrite"
  - name: "auth-gate"
    weight: 2
    flow:
      - get:
          url: "/orders"
          name: "auth-gate-redirect"

